<style>
/* ============================================================
   YOU ZODIAC — shared site styles
   Midnight & Marigold theme, per approved app design tokens
   ============================================================ */

:root {
  --bg-top: #2B3260;
  --bg-mid: #1B1F3B;
  --bg-deep: #14172E;

  --gold-light: #F8D488;
  --gold-mid: #E8A33D;
  --gold-deep: #B87423;

  --ink: #F4EFE2;
  --ink-dim: #B9BAD4;
  --navy-on-gold: #1B1F3B;

  --hairline: rgba(244, 239, 226, 0.14);

  --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

  --max-w: 880px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background:
    radial-gradient(120% 70% at 50% 0%, var(--bg-top) 0%, var(--bg-mid) 48%, var(--bg-deep) 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

a { color: var(--gold-light); text-decoration: none; }
a:hover { color: var(--gold-mid); text-decoration: underline; }
a:focus-visible,
button:focus-visible {
  outline: 2px solid var(--gold-light);
  outline-offset: 3px;
  border-radius: 4px;
}

h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.01em;
}

/* ---------- starfield ---------- */
.starfield {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.starfield span {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: var(--gold-light);
  opacity: 0.35;
  animation: twinkle 5.5s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.15; }
  50% { opacity: 0.75; }
}
@media (prefers-reduced-motion: reduce) {
  .starfield span { animation: none; opacity: 0.35; }
  html { scroll-behavior: auto; }
}

/* ---------- layout shell ---------- */
.wrap {
  position: relative;
  z-index: 1;
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 24px;
}

header.site-header {
